<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성적 관리 | Team 06</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/views/dashboard.css" />
  <link rel="stylesheet" href="css/views/courses.css" />
  <link rel="stylesheet" href="css/views/stats.css" />
</head>
<body>
  <!--
    이 파일은 "뼈대"만 둔다. 각 탭의 실제 내용은 js/ui/views/*.js 가 그린다.
    → 탭 화면을 고칠 때 index.html 을 건드리지 않아도 되므로 충돌이 줄어든다.
  -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#dashboard">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">성적관리</span>
      </a>
      <nav class="tabs" aria-label="메뉴">
        <a class="tab" href="#dashboard" data-tab="dashboard">대시보드</a>
        <a class="tab" href="#courses" data-tab="courses">학기별 과목</a>
        <a class="tab" href="#stats" data-tab="stats">성적 분석</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="view" id="view-dashboard" hidden></section>
    <section class="view" id="view-courses" hidden></section>
    <section class="view" id="view-stats" hidden></section>
  </main>

  <!-- 로드 순서: core(로직) → ui(화면) → app(시작) -->
  <script src="js/core/gpa.js"></script>
  <script src="js/core/validator.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/courseService.js"></script>

  <script src="js/ui/common.js"></script>
  <script src="js/ui/views/dashboardView.js"></script>
  <script src="js/ui/views/coursesView.js"></script>
  <script src="js/ui/views/statsView.js"></script>
  <script src="js/ui/tabs.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
