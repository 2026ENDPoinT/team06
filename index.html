<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성적 관리 | Team 06</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/views/login.css" />
  <link rel="stylesheet" href="css/views/dashboard.css" />
  <link rel="stylesheet" href="css/views/courses.css" />
  <link rel="stylesheet" href="css/views/stats.css" />
  <link rel="stylesheet" href="css/views/memo.css" />
  <link rel="stylesheet" href="css/views/settings.css" />
</head>
<body>
  <!--
    이 파일은 "뼈대"만 둔다. 각 탭의 실제 내용은 js/ui/views/*.js 가 그린다.
    화면 컨셉: 책상 위에 펼쳐진 노트. 탭 = 책 위쪽에 꽂힌 인덱스 탭, 설정 = 책 오른쪽 옆에 꽂힌 빨간 책갈피.
  -->
  <div class="book">
    <!-- 인덱스 탭: 종이 위쪽 가장자리에 꽂혀 있음 -->
    <nav class="tabs" aria-label="메뉴">
      <a class="tab" href="#dashboard" data-tab="dashboard">메인</a>
      <a class="tab" href="#courses" data-tab="courses">과목·성적</a>
      <a class="tab" href="#stats" data-tab="stats">성적 분석</a>
      <a class="tab" href="#memo" data-tab="memo">메모</a>
    </nav>

    <!-- 설정 책갈피: 책 오른쪽 옆에 꽂혀 있음 (맨 뒷페이지) -->
    <a class="bookmark" href="#settings" data-tab="settings" aria-label="설정">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/>
      </svg>
    </a>

    <div class="page" id="page">
      <header class="page-head">
        <a class="brand" href="#dashboard">
          <img class="brand-mark" src="assets/logo.png" alt="" />
          <span class="brand-sub">ENDPoinT Team 6</span>
        </a>
      </header>

      <main class="container">
        <section class="view" id="view-login" hidden></section>
        <section class="view" id="view-dashboard" hidden></section>
        <section class="view" id="view-courses" hidden></section>
        <section class="view" id="view-stats" hidden></section>
        <section class="view" id="view-memo" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>
  </div>

  <!-- 로드 순서: core(로직) → ui(화면) → app(시작) -->
  <script src="js/core/gpa.js"></script>
  <script src="js/core/validator.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/courseService.js"></script>
  <script src="js/core/firebase.js"></script>

  <script src="js/ui/common.js"></script>
  <script src="js/ui/views/loginView.js"></script>
  <script src="js/ui/views/dashboardView.js"></script>
  <script src="js/ui/views/coursesView.js"></script>
  <script src="js/ui/views/statsView.js"></script>
  <script src="js/ui/views/memoView.js"></script>
  <script src="js/ui/views/settingsView.js"></script>
  <script src="js/ui/pageTurn.js"></script>
  <script src="js/ui/tabs.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
